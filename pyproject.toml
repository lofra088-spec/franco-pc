[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "franco"
version = "7.0.0"
description = "F.R.A.N.C.O. 7 — fast local actions with AI fallback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "FRANCO AI Systems" }]
dependencies = [
    "python-dotenv",
]

[project.optional-dependencies]
voice = ["SpeechRecognition", "pyaudio", "edge-tts"]
ai = ["anthropic", "openai"]
full = ["SpeechRecognition", "pyaudio", "edge-tts", "anthropic", "openai", "requests", "cryptography"]
dev = ["pytest", "ruff"]

[project.scripts]
franco = "franco.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
franco = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
